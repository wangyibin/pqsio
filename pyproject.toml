[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pqsio"
version = "0.1.0"
description = "Python bindings for the pqsio Rust shared library"
requires-python = ">=3.9"

[project.urls]
Repository = "https://github.com/wangyibin/pqsio"

[tool.setuptools.packages.find]
where = ["python"]
