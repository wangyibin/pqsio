site_name: pqsio
site_description: Pairs and concat PQS storage for Rust, C, C++ and Python
docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  logo: assets/pqsio-icon.png
  favicon: assets/pqsio-icon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: orange
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.highlight

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Get started:
      - Installation: installation.md
      - Python: python.md
      - Rust: rust.md
      - C and C++: native.md
  - Read and write:
      - Streaming: streaming.md
      - Columnar I/O: columnar.md
      - Parallel writing: parallel.md
  - Dataset operations:
      - Inspection and validation: inspection.md
      - Region queries: query.md
      - Subset: subset.md
      - Merge: merge.md
      - Concat to pairs: convert.md
      - Copy numbers: copy-numbers.md
  - Reference:
      - Storage and compatibility: storage.md
      - Development and validation: development.md
      - Documentation maintenance: documentation.md
