[project]
site_name = "pqsio"
site_description = "Install pqsio, call the Python API, and use the CLI to read, write and convert genomic contacts"
docs_dir = "docs"
site_dir = "site"
dev_addr = "localhost:2121"

nav = [
  { "Home" = "index.md" },
  { "Installation" = "installation.md" },
  { "Python API" = "python.md" },
  { "CLI" = "cli.md" },
  { "PQS format" = "pqs-format.md" },
  { "Reference" = [
    { "API contracts" = "api.md" },
    { "Other languages" = [
      { "Rust" = "rust.md" },
      { "C and C++" = "native.md" },
    ] },
    { "Dataset operations" = [
      { "Browse and export" = "browse.md" },
      { "Quality statistics" = "stats.md" },
      { "Inspection and validation" = "inspection.md" },
      { "Region queries" = "query.md" },
      { "Subset" = "subset.md" },
      { "Merge" = "merge.md" },
      { "Concat to pairs" = "convert.md" },
      { "BAM and PAF import" = "import.md" },
      { "Pairs to Cooler" = "cool.md" },
      { "Copy numbers" = "copy-numbers.md" },
    ] },
    { "Advanced I/O" = [
      { "Streaming" = "streaming.md" },
      { "Columnar I/O" = "columnar.md" },
      { "Parallel writing" = "parallel.md" },
      { "Storage and compatibility" = "storage.md" },
    ] },
    { "Development" = [
      { "Build and validation" = "development.md" },
      { "Documentation maintenance" = "documentation.md" },
    ] },
  ] },
]

[project.theme]
variant = "modern"
language = "en"
logo = "assets/pqsio-icon.png"
favicon = "assets/pqsio-icon.png"
features = [
  "navigation.top",
  "navigation.footer",
  "toc.follow",
  "content.code.copy",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
tables = {}
attr_list = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.superfences = {}
pymdownx.details = {}
toc.permalink = true
