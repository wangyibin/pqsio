[project]
site_name = "pqsio"
site_description = "Install pqsio, call the Python API, and use the CLI to read, write and convert genomic contacts"
docs_dir = "docs"
site_dir = "site"
dev_addr = "localhost:2121"

nav = [
  { "Home" = "index.md" },
  { "Installation" = "installation.md" },
  { "CLI" = "cli.md" },
  { "Python API" = "python.md" },
  { "Rust API" = "rust.md" },
  { "Reference" = [
    { "Overview" = "reference.md" },
    { "PQS format" = "pqs-format.md" },
    { "Concat workflow" = "concat-workflow.md" },
    { "API contracts" = "api.md" },
    { "Rust details" = "rust-reference.md" },
    { "C and C++" = "native.md" },
    { "Development" = "development.md" },
  ] },
]

[project.theme]
variant = "modern"
language = "en"
logo = "assets/pqsio-icon.png"
favicon = "assets/pqsio-icon.png"
features = [
  "navigation.top",
  "navigation.footer",
  "toc.follow",
  "content.code.copy",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
tables = {}
attr_list = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.superfences = {}
pymdownx.details = {}
toc.permalink = true
