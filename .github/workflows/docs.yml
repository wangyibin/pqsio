name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'zensical.toml'
      - 'pixi.toml'
      - 'pixi.lock'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'zensical.toml'
      - 'pixi.toml'
      - 'pixi.lock'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.repository }}-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up locked Pixi documentation environment
        uses: prefix-dev/setup-pixi@v0.11.0
        with:
          pixi-version: v0.61.0
          environments: docs
          locked: true
          cache: true

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.repository == 'wangyibin/pqsio'
        uses: actions/configure-pages@v5

      - name: Build documentation
        run: pixi run --locked -e docs docs-build

      - name: Upload site
        if: github.event_name != 'pull_request' && github.repository == 'wangyibin/pqsio'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: >-
      github.repository == 'wangyibin/pqsio' &&
      (github.event_name == 'workflow_dispatch' ||
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
