[workspace]
name = "pqsio"
version = "0.2.3"
description = "Pairs and concat PQS storage for Rust, C, C++ and Python"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64"]

[system-requirements]
linux = "3.10.0"
libc = "2.17"

[feature.build.dependencies]
rust = ">=1.91.1,<1.92"
c-compiler = ">=1.9.0,<2"
cxx-compiler = ">=1.9.0,<2"
make = ">=4.3,<5"
cmake = ">=4.0.2,<5"
pkg-config = "0.29.*"
libclang = ">=14.0,<15.0"
clang = ">=14.0,<15.0"

[feature.test.dependencies]
python = "3.11.*"
# Test-only, matching the existing compatibility-test environment.
polars = "==0.20.29"

[feature.docs]
platforms = ["linux-64"]

[feature.docs.dependencies]
python = "3.12.*"
mdx_truly_sane_lists = ">=1.3,<2"
pillow = ">=9.4.0"
cairosvg = "2.7.1.*"
git-cliff = ">=2.4.0,<3"
zensical = ">=0.0.47,<0.1"

[feature.docs.tasks]
docs-build = { env = { ZENSICAL_POLL_WATCHER = "1" }, cmd = "zensical build --strict --clean -f zensical.toml && test -s site/index.html", description = "Build Zensical documentation and verify the generated homepage" }
docs-serve = { env = { ZENSICAL_POLL_WATCHER = "1" }, cmd = "zensical serve -f zensical.toml", description = "Preview Zensical documentation with live reload" }

[environments]
default = { features = ["build", "test"] }
docs = { features = ["docs"], no-default-feature = true }

[activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT/python"
PQSIO_LIBRARY = "$PIXI_PROJECT_ROOT/target/dev-release/libpqsio.so"
POLARS_MAX_THREADS = "4"
RAYON_NUM_THREADS = "4"
LIBCLANG_PATH = "$CONDA_PREFIX/lib"

[tasks]
pqsio = { cmd = "target/dev-release/pqsio", description = "Run the native Rust command-line interface", depends-on = ["build"] }
build = { cmd = "cargo build --locked --profile dev-release -j 4", description = "Build native CLI and libraries for development" }
build-release = { cmd = "cargo build --locked --release -j 4", description = "Build final release CLI and libraries explicitly" }
test-rust = { cmd = "cargo test --locked --profile dev-release -j 4" }
test-python = { cmd = "python -m unittest discover -s tests -p test_python.py -v", depends-on = ["build"] }
test-compression = { cmd = "python -m unittest discover -s tests -p test_compression.py -v", depends-on = ["build"] }
test-columns = { cmd = "python -m unittest discover -s tests -p test_columns.py -v", depends-on = ["build"] }
test-native = { cmd = "python -m unittest discover -s tests -p test_native.py -v", depends-on = ["build"] }
test-parallel = { cmd = "python -m unittest discover -s tests -p test_parallel.py -v", depends-on = ["build"] }
test-streaming = { cmd = "python -m unittest discover -s tests -p test_streaming.py -v", depends-on = ["build"] }
bench-streaming = { cmd = "python scripts/streaming_bench.py", depends-on = ["build"], description = "Opt-in modest synthetic streaming measurement" }
test-query = { cmd = "python -m unittest discover -s tests -p test_query.py -v", depends-on = ["build"] }
bench-query = { cmd = "python scripts/query_bench.py", depends-on = ["build"], description = "Opt-in synthetic region-query measurement" }
test-subset = { cmd = "python -m unittest discover -s tests -p test_subset.py -v", depends-on = ["build"] }
test-merge = { cmd = "python -m unittest discover -s tests -p test_merge.py -v", depends-on = ["build"] }
test-concat-workflow = { cmd = "python -m unittest discover -s tests -p test_concat_workflow.py -v", depends-on = ["build"], description = "Test complete-read selection and deferred pair expansion" }
test-convert = { cmd = "python -m unittest discover -s tests -p test_convert.py -v", depends-on = ["build"] }
test-cli = { cmd = "python -m unittest discover -s tests -p test_cli.py -v", depends-on = ["build"] }
test-presentation = { cmd = "python -m unittest discover -s tests -p test_presentation.py -v", depends-on = ["build"] }
test-user-commands = { cmd = "python -m unittest discover -s tests -p test_user_commands.py -v", depends-on = ["build"] }
test-import = { cmd = "python -m unittest discover -s tests -p test_import.py -v", depends-on = ["build"], description = "Test native BAM/PAF import (BAM fixture generation requires samtools)" }
test-cool = { cmd = "python -m unittest discover -s tests -p test_cool.py -v", depends-on = ["build"], description = "Test native Cooler conversion; optional PQSIO_COOLER_TEST_PYTHON enables independent cooler/h5py checks" }
bench-import = { cmd = "python scripts/import_bench.py", depends-on = ["build"], description = "Opt-in synthetic BAM/PAF import comparison; requires --baseline-python and --report" }
test-copy-numbers = { cmd = "python -m unittest discover -s tests -p test_copy_numbers.py -v", depends-on = ["build"] }
test-decode = { cmd = "python -m unittest discover -s tests -p test_decode.py -v", depends-on = ["build"] }
test-inspection = { cmd = "python -m unittest discover -s tests -p test_inspection.py -v", depends-on = ["build"] }
test = { depends-on = ["test-concat-workflow", "test-user-commands", "test-presentation", "test-cool", "test-import", "test-cli", "test-convert", "test-copy-numbers", "test-decode", "test-subset", "test-query", "test-merge", "test-inspection", "test-rust", "test-python", "test-compression", "test-columns", "test-native", "test-parallel", "test-streaming"], description = "Run standalone Rust, Python, C and C++ tests" }
lint = { cmd = "cargo clippy --locked --profile dev-release --all-targets -j 4 -- -D warnings" }
bench-columns = { cmd = "python scripts/columnar_bench.py", depends-on = ["build"], description = "Run the synthetic columnar benchmark (explicit opt-in)" }
