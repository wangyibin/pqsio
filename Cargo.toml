[package]
name = "pqsio"
version = "0.2.5"
edition = "2021"
description = "Shared pairs and concat PQS storage for Rust, C, C++ and Python"
license = "BSD-3-Clause"
repository = "https://github.com/wangyibin/pqsio"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
clap = "4.4.10"
anyhow = "1.0.70"
chrono = "0.4.24"
flate2 = { version = "1.1.5", default-features = false }
gzp = "=2.0.1"
rust-htslib = { version = "=0.51.0", default-features = false }
hdf5 = "0.8"
hdf5-sys = { version = "0.8", features = ["static", "zlib"] }
polars = { version = "0.49.1", default-features = false, features = ["parquet", "dtype-u8", "dtype-categorical"] }

[profile.dev-release]
inherits = "release"
codegen-units = 16
debug = 1
